[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "AI QA automation agent untuk aplikasi web (self-hosted)"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.47",
  "openai>=1.40",
  "anthropic>=0.34",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flask>=3.0"]

[project.scripts]
qa-agent = "qa_agent.cli:app"

[tool.setuptools.packages.find]
include = ["qa_agent*"]

[tool.setuptools.package-data]
qa_agent = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: butuh Playwright Chromium + aplikasi demo",
  "llm: butuh endpoint AI sungguhan (dijalankan manual)",
]
addopts = "-m 'not llm'"
